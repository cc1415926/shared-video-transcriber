name: Build and publish installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Core tests
        run: python -m unittest discover -s tests -v
      - name: Bundle pinned WeChat Channels collector
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'wx_channel_v5.7.13.zip'
          Invoke-WebRequest -Uri 'https://github.com/nobiyou/wx_channel/releases/download/v5.7.13/wx_channel_v5.7.13.zip' -OutFile $archive
          ./scripts/prepare_wx_channel_bundle.ps1 -ArchivePath $archive
      - name: Build onedir application
        run: python scripts/build_package.py
      - name: Create portable Windows ZIP and checksum
        shell: pwsh
        run: |
          $portable = 'dist/installers/VideoInbox-Portable-Windows-x64.zip'
          New-Item -ItemType Directory -Force -Path 'dist/installers' | Out-Null
          Compress-Archive -Path 'dist/VideoInbox/*' -DestinationPath $portable -CompressionLevel Optimal
          $hash=(Get-FileHash -LiteralPath $portable -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$portable.sha256" -Value "$hash  VideoInbox-Portable-Windows-x64.zip" -Encoding ascii
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer and checksum
        shell: pwsh
        run: ./scripts/build_windows_installer.ps1
      - name: Optional Windows signing
        if: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' && secrets.WINDOWS_CERT_PASSWORD != '' }}
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $cert = Join-Path $env:RUNNER_TEMP 'videoinbox-signing.pfx'
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName)
          if (-not $signtool) { throw 'signtool.exe was not found on the runner' }
          & $signtool sign /fd SHA256 /f $cert /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 dist/installers/VideoInbox-Setup-Windows-x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows signing failed' }
          $hash=(Get-FileHash dist/installers/VideoInbox-Setup-Windows-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content dist/installers/VideoInbox-Setup-Windows-x64.exe.sha256 "$hash  VideoInbox-Setup-Windows-x64.exe" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: |
            dist/installers/VideoInbox-Setup-Windows-x64.exe
            dist/installers/VideoInbox-Setup-Windows-x64.exe.sha256
            dist/installers/VideoInbox-Portable-Windows-x64.zip
            dist/installers/VideoInbox-Portable-Windows-x64.zip.sha256
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            label: AppleSilicon
          - runner: macos-26-intel
            label: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Core tests
        run: python -m unittest discover -s tests -v
      - name: Build application bundle
        run: python scripts/build_package.py
      - name: Optional Developer ID signing
        if: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.MACOS_SIGNING_IDENTITY != '' }}
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/videoinbox.keychain-db"
          certificate="$RUNNER_TEMP/videoinbox.p12"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$keychain"
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" dist/VideoInbox.app
          codesign --verify --deep --strict --verbose=2 dist/VideoInbox.app
      - name: Create signed or test DMG
        env:
          VIDEO_INBOX_UNSIGNED_TEST: ${{ (secrets.MACOS_CERTIFICATE_P12_BASE64 == '' || secrets.MACOS_CERTIFICATE_PASSWORD == '' || secrets.MACOS_SIGNING_IDENTITY == '') && '1' || '0' }}
        run: bash scripts/create_dmg.sh
      - name: Optional notarization and stapling
        if: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.MACOS_SIGNING_IDENTITY != '' && secrets.MACOS_NOTARY_KEY_BASE64 != '' && secrets.MACOS_NOTARY_KEY_ID != '' && secrets.MACOS_NOTARY_ISSUER != '' }}
        env:
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          echo "$MACOS_NOTARY_KEY_BASE64" | base64 --decode > "$key"
          dmg=$(find dist/installers -name '*.dmg' -print -quit)
          xcrun notarytool submit "$dmg" --key "$key" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER" --wait
          xcrun stapler staple "$dmg"
      - name: Write checksum
        run: |
          dmg=$(find dist/installers -name '*.dmg' -print -quit)
          shasum -a 256 "$dmg" > "$dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.label }}
          path: |
            dist/installers/*.dmg
            dist/installers/*.dmg.sha256
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.tag != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify checksums are present
        run: |
          find release-assets -type f -maxdepth 1 -print
          test -n "$(find release-assets -name '*.sha256' -print -quit)"
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --generate-notes --title "Video Inbox $RELEASE_TAG"
          fi
